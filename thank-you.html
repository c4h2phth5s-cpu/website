<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Ledger Craft Solutions</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --text:#0b1220;
      --muted:#5f6b85;
      --border:rgba(11,18,32,.12);
      --shadow:0 16px 40px rgba(11,18,32,.10);
      --radius:18px;
      --max:900px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,Arial;
      color:var(--text);
      background:#f6f8fc;
      line-height:2.55;
    }

    .wrap{
      max-width:var(--max);
      margin:0 auto;
      padding:40px 20px;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
    }

    .card{
      background:rgba(255,255,255,.9);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:26px;
      width:100%;
      max-width:520px;
      text-align:center;
    }

    h1{
      margin:0 0 6px;
      font-size:28px;
    }

    p{
      margin:0 0 16px;
      color:var(--muted);
      font-size:15px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:10px 14px;
      border-radius:14px;
      border:1px solid var(--border);
      background:#fff;
      color:var(--text);
      font-weight:800;
      text-decoration:none;
      transition:transform .15s ease;
    }

    .btn:hover{
      transform:translateY(-1px);
    }

    .footer-text{
      margin-top:20px;
      font-size:25px;
      color:var(--muted);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">

      <h1>Your Request received</h1>

      <p>
        <div style="font-size:18px; color:var(--muted); letter-spacing:.3px;"> Thanks — we’ve got it. 
        <div style="font-size:18px; color:var(--muted); letter-spacing:.3px;"> A member of our team will respond 
        <div style="font-size:18px; color:var(--muted); letter-spacing:.3px;"> within 1-2 business day.
      </p>

      <a class="btn" href="https://ledgercraftsolutions.ca/">
        Back to HomePage
      </a>
<!-- Brand Block -->
<div style="margin-top:20px; display:flex; flex-direction:column; align-items:center; gap:6px;">

  <img src="Logo 1.png" alt="Ledger Craft Solutions Logo" style="height:200px;" />

  <div style="font-weight:800; font-size:25px; letter-spacing:.5px;">
    Ledger Craft Solutions
  </div>

  <div style="font-size:18px; color:var(--muted); letter-spacing:.3px;">
    Bookkeeping. Simple. Done right.
  </div>

</div>
  </div>
</div>
</p>
      </div>

    </div>
  </div>
</script>
  <p style="margin-top:10px; font-size:12px; color:var(--muted);">
Redirecting in <span id="countdown">5</span> seconds...
</p>

<script>
  let timeLeft = 5;
  const el = document.getElementById("countdown");

  const timer = setInterval(() => {
    timeLeft--;
    el.textContent = timeLeft;

    if (timeLeft <= 0) {
      clearInterval(timer);
      window.location.href = "https://ledgercraftsolutions.ca/";
    }
  }, 1000);
</script>
</body>
</html>
